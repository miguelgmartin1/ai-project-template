[project]
name = "project"
version = "0.1.0"
description = "CHANGE ME: one-line problem statement"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",          # OpenRouter-compatible client
  "langfuse>=2.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "ipykernel", "jupyter"]
evals = ["pandas", "matplotlib", "datasets"]
# Uncomment per project:
# rag = ["pgvector", "psycopg[binary]", "rank-bm25", "sentence-transformers", "pypdf"]
# agents = ["langgraph", "mcp"]
# ml = ["torch", "transformers", "peft", "trl", "accelerate"]

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["llm: tests that call a real LLM API (skipped in CI unless RUN_LLM_TESTS=1)"]
